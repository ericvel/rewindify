      THESIS: Practice hardware, not a media player. One warm plate, printed
      scales, dark control caps, and one orange that means only the loop.
      Refuses the dark rounded-card player this category always ships.
      OWN-WORLD: Braun product graphics. Plate #EDE9E2 with recessed wells and
      raised caps; ink #2B2B2A; orange #E2510F rationed to the loop alone;
      Archivo with tabular figures and no monospace anywhere; one Phosphor icon
      family at two weights.
      STORY: A musician holding an instrument glances once, reads the exact
      position, steps back five seconds, and pins the passage as a loop.
      FIRST VIEWPORT: Today's skeleton kept. Position numeral dominant at the
      top-left of a recessed panel; graduated timeline beneath it; step keys
      equal to play; recently played a printed index; no accent on the surface
      until the loop arms.
      FORM: Bench Instrument, candidate 2 of the safer register; seed 701ed916.
      FINISH: unreviewed and undocumented is unfinished; this build ends with
      the finish review, the verdict, DESIGN.md, and every shipping raster
      carrying its provenance.
